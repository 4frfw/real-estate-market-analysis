name: Analytics and Pages
on:
  push:
    branches: [main]
    paths: ['data/raw/**', 'scripts/**', 'tests/**', 'requirements.txt', '.github/workflows/analytics.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/analyze.py
      - name: Save calculated files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/processed reports site
          git diff --staged --quiet || git commit -m "Update calculated market reports"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: market-reports
          path: |
            reports/
            data/processed/
          retention-days: 30
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
